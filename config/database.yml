# SQLite on bare metal. Development data lives in the XDG state dir, not the
# checkout, so a worktree slot isolates its data by setting XDG_STATE_HOME
# (the source project's slot model). Tests use a file under tmp/ in the checkout.
<%
  require "fileutils"
  state_dir = File.join(ENV.fetch("XDG_STATE_HOME", File.expand_path("~/.local/state")), "agentic-rails")
  FileUtils.mkdir_p(state_dir)
%>
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= File.join(state_dir, "development.sqlite3") %>

test:
  <<: *default
  database: tmp/test.sqlite3

production:
  <<: *default
  database: <%= File.join(state_dir, "production.sqlite3") %>
